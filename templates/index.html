<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground</title>

    <style>
        body {
            background-color: #222;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
            background-color: #333;
            border-radius: 10px;
        }

        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #005fa3;
        }

        #python-output {
            margin-top: 25px;
            padding: 20px;
            background-color: #181818;
            border-radius: 5px;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Python Playground</h1>

        <p>Click the button to execute the Python program.</p>

        <button onclick="runPython()">Execute Python</button>

        <div id="python-output">
            Python output will appear here.
        </div>
    </div>

    <script>
        async function runPython() {
            const output = document.getElementById("python-output");

            output.innerText = "Executing Python...";

            try {
                const response = await fetch("/run-python", {
                    method: "POST"
                });

                const data = await response.json();
                output.innerText = data.output;

            } catch (error) {
                output.innerText = "Error executing Python: " + error;
            }
        }
    </script>
</body>
</html>
